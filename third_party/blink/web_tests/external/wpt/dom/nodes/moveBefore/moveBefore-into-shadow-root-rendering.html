<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<div id="hostA" style="position:absolute; left:0; top:0; width:100px"></div>
<div id="hostB" style="position:absolute; left:500px; top:300px; width:100px"></div>
<div id="hostC"></div>
<div id="hostD"></div>
<script>
test(() => {
  const rootA = hostA.attachShadow({mode: 'open'});
  const item = document.createElement('div');
  item.textContent = 'item';
  hostB.append(item);
  assert_equals(item.getBoundingClientRect().left, 500,
                'precondition: item renders inside hostB');

  rootA.moveBefore(item, null);

  assert_equals(item.getRootNode(), rootA, 'item is in hostA\'s shadow tree');
  assert_equals(item.getBoundingClientRect().left, 0,
                'item renders inside hostA after the move');
}, 'moveBefore() into a shadow root updates the layout tree position');

test(() => {
  const rootC = hostC.attachShadow({mode: 'open'});
  const rootD = hostD.attachShadow({mode: 'open'});
  const x = document.createElement('div');
  x.textContent = 'x';
  const y = document.createElement('div');
  y.textContent = 'y';
  rootC.append(x);
  rootD.append(y);
  document.body.offsetHeight;

  rootC.moveBefore(y, null);
  document.body.offsetHeight;
  x.style.display = 'none';
  document.body.offsetHeight;
  x.style.display = '';
  document.body.offsetHeight;
}, 'moveBefore() between two shadow roots does not crash on a later reattach');
</script>
